<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hệ thống đặt lịch CLB Võ – Tài liệu dự án</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ec; --card:#ffffff; --ink:#1b2a2f; --muted:#5a6b70; --line:#d3dad3;
  --banner1:#1b2a2f; --banner2:#34505a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121a1d; --card:#1b272b; --ink:#e7eeea; --muted:#9bacaf; --line:#2e3e43;
  --banner1:#0b1214; --banner2:#24404a;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:40px 20px 56px}
h1{text-align:center;font-size:1.7rem;margin:0 0 6px}
.sub{text-align:center;color:var(--muted);margin:0 0 28px}
.banner{height:200px;border-radius:12px;background:linear-gradient(135deg,var(--banner1),var(--banner2));
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.banner span{font-size:9rem;color:rgba(255,255,255,.12);font-weight:700;line-height:1}
.banner b{position:absolute;color:#fff;font-size:1.15rem;font-weight:600;letter-spacing:.02em}
.banner img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.overview{max-width:640px;margin:28px auto 36px;text-align:center}
h2{font-size:1.05rem;margin:32px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.doc{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--card);
  border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;
  color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
a.doc:hover{transform:translateY(-2px);border-color:var(--c)}
a.doc:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.doc .ic{font-size:1.5rem}
.doc strong{display:block;font-size:.95rem}
.doc small{color:var(--muted);font-size:.8rem}
.doc.soon{opacity:.55;border-left-color:var(--muted);cursor:not-allowed}
.tag{margin-left:auto;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:40px}
@media (prefers-reduced-motion:reduce){.doc{transition:none}}
</style>
</head>
<body>
<main class="wrap">

  <h1>Tài liệu dự án</h1>

  <!-- Muốn dùng ảnh banner riêng: thêm <img src="images/banner.png" alt=""> vào trong .banner -->
  <div class="banner" role="img" aria-label="Banner dự án">
    <span>道</span><b><h1>🥋 Hệ thống đặt lịch CLB Võ</h1> </b>
  </div>

  <p class="overview">
    <strong>Tổng quan:</strong> Hệ thống giúp học viên đặt chỗ vào lớp Basic hoặc Advanced
    theo trình độ, giúp giáo viên nắm sĩ số từng ca và giúp chủ CLB kiểm soát sức chứa lớp học.
  </p>

  <div id="app"></div>

  <footer>Cập nhật lần cuối: <span id="updated">--</span></footer>
</main>

<script>
/* ====== CHỈNH Ở ĐÂY ======
   href: đường dẫn tới tài liệu (file trong thư mục docs/ hoặc link ngoài).
   Để href = "" thì ô hiện "Sắp có" và không bấm được. */
const SECTIONS = [
  { title: "🎯 Khởi tạo dự án", items: [
    { name: "Vision & Scope (BRD)",  desc: "Mục tiêu, phạm vi, giá trị mang lại",  icon: "🎯", color: "#6b4fa0", href: "" },
    { name: "Stakeholder Analysis",  desc: "Ai liên quan, ai quyết định",            icon: "👥", color: "#6b4fa0", href: "" },
    { name: "Thuật ngữ (Glossary)",  desc: "Basic, Advanced, ca, sức chứa...",       icon: "📖", color: "#6b4fa0", href: "" },
  ]},
  { title: "🔍 Phân tích", items: [
    { name: "Quy trình nghiệp vụ",   desc: "As-Is / To-Be, luồng đặt lịch",          icon: "🔀", color: "#00897b", href: "docs/test-plan.html" },
    { name: "Use Case",              desc: "Sơ đồ và đặc tả use case",               icon: "🧩", color: "#00897b", href: "" },
    { name: "Business Rules",        desc: "Danh mục quy tắc nghiệp vụ (BR-xx)",     icon: "⚖️", color: "#00897b", href: "" },
    { name: "Wireframe / Mockup",    desc: "Thiết kế giao diện (link Figma)",        icon: "🖼️", color: "#00897b", href: "docs/test-plan.html" },
    { name: "ERD & Data Dictionary", desc: "Mô hình dữ liệu",                        icon: "🗄️", color: "#00897b", href: "" },
  ]},
  { title: "📋 Yêu cầu", items: [
    { name: "Đặc tả (SRS)",          desc: "Quy tắc nghiệp vụ, ma trận lịch",        icon: "📄", color: "#2f6fa3", href: "SRS.html" },
    { name: "User Stories",          desc: "Câu chuyện người dùng, tiêu chí chấp nhận", icon: "📝", color: "#d9822b", href: "" },
    { name: "Traceability Matrix",   desc: "Liên kết yêu cầu ↔ test case",           icon: "🔗", color: "#2f6fa3", href: "" },
  ]},
  { title: "🧪 Kiểm thử", items: [
    { name: "Test Plan",             desc: "Kế hoạch kiểm thử",                      icon: "📒", color: "#2e8b57", href: "docs/test-plan.html" },
    { name: "Test Cases – Module 1", desc: "Quản lý học viên & level",               icon: "✅", color: "#2f6fa3", href: "docs/testcases-1.html" },
    { name: "Test Cases – Module 2", desc: "Quản lý lớp & lịch",                     icon: "✅", color: "#2f6fa3", href: "" },
    { name: "Test Cases – Module 3", desc: "Đặt và hủy chỗ",                         icon: "✅", color: "#2f6fa3", href: "" },
    { name: "UAT Plan",              desc: "Kế hoạch nghiệm thu cùng khách",         icon: "🤝", color: "#2e8b57", href: "docs/test-plan.html" },
    { name: "Bug Report",            desc: "Danh sách lỗi",                          icon: "🪲", color: "#b5483a", href: "" },
  ]},
  { title: "🗂️ Quản lý dự án", items: [
    { name: "Q&A Log",               desc: "Câu hỏi mở và câu trả lời của khách",    icon: "❓", color: "#c0392b", href: "docs/test-plan.html" },
    { name: "Biên bản họp",          desc: "Meeting minutes",                        icon: "🗒️", color: "#c0392b", href: "" },
    { name: "Change Request Log",    desc: "Yêu cầu thay đổi và quyết định",         icon: "🔄", color: "#c0392b", href: "" },
    { name: "Risk & Assumption Log", desc: "Rủi ro, giả định, ràng buộc",            icon: "⚠️", color: "#c0392b", href: "" },
  ]},
  { title: "📦 Bàn giao", items: [
    { name: "Hướng dẫn sử dụng",     desc: "Cho Admin, giáo viên, học viên",         icon: "📘", color: "#7a6a2f", href: "docs/test-plan.html" },
    { name: "Release Notes",         desc: "Các phiên bản đã phát hành",             icon: "🚀", color: "#7a6a2f", href: "docs/test-plan.html" },
  ]},
];
document.getElementById("updated").textContent = new Date(document.lastModified).toLocaleDateString("vi-VN");

const app = document.getElementById("app");
SECTIONS.forEach(s => {
  const h = document.createElement("h2"); h.textContent = s.title; app.appendChild(h);
  const g = document.createElement("div"); g.className = "grid";
  s.items.forEach(i => {
    const el = document.createElement(i.href ? "a" : "div");
    el.className = "doc" + (i.href ? "" : " soon");
    el.style.setProperty("--c", i.color);
    if (i.href) { el.href = i.href; el.target = "_blank"; el.rel = "noopener"; }
    el.innerHTML = `<span class="ic">${i.icon}</span><span><strong>${i.name}</strong><small>${i.desc}</small></span>` +
                   (i.href ? "" : `<span class="tag">Sắp có</span>`);
    g.appendChild(el);
  });
  app.appendChild(g);
});
</script>
</body>
</html>
